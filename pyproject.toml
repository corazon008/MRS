[project]
name = "mrs"
version = "0.1.0"
description = "My RAG System"
readme = "README.md"
authors = []
requires-python = ">=3.14"
dependencies = [
    "beir>=2.2.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "ollama>=0.6.2",
    "qdrant-client>=1.18.0",
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
